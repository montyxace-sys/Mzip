name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Calcular versión
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '1.0.0' }
          "MZIP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publicar Mzip portable
        shell: pwsh
        run: dotnet publish src/Mzip/Mzip.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -p:Version=$env:MZIP_VERSION -o src/Mzip/bin/publish/portable

      - name: Publicar instalador
        shell: pwsh
        run: dotnet publish src/MzipSetupExe/MzipSetupExe.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -p:Version=$env:MZIP_VERSION -o out/setup

      - name: Preparar artefactos
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item src/Mzip/bin/publish/portable/Mzip.exe dist/Mzip.exe
          Copy-Item out/setup/MzipSetup.exe dist/MzipSetup.exe
          Get-FileHash dist/Mzip.exe, dist/MzipSetup.exe -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content dist/SHA256SUMS.txt

      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: mzip-windows-x64
          path: dist/*

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
